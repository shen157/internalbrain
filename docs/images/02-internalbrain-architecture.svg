  <text x="660" y="760" text-anchor="middle" font-size="16" font-weight="700" fill="#0B5D3F">Permission Engine</text>
  <text x="505" y="792" font-size="12.5" fill="#1F5C46">User identity · Group membership · Resource ACL</text>
  <text x="505" y="814" font-size="12.5" fill="#1F5C46">Slack channel membership</text>
  <text x="505" y="836" font-size="12.5" fill="#1F5C46">Live grant / revoke</text>
  <text x="505" y="864" font-size="12.5" font-weight="700" fill="#0B5D3F">Permission changes take effect on the next query</text>
  <text x="505" y="886" font-size="12.5" font-weight="700" fill="#0B5D3F">No re-indexing or re-embedding required</text>
  <text x="505" y="910" font-size="12" fill="#4E7A66">Reviewer-only administration (compliance role)</text>
