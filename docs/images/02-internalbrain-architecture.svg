  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <text x="960" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#16213A">InternalBrain — Permission-Aware Enterprise RAG Architecture</text>

  <!-- ============ BANNER ============ -->
  <rect x="40" y="68" width="1840" height="62" rx="12" fill="#16213A"/>
  <text x="960" y="106" text-anchor="middle" font-size="22">
    <tspan font-weight="800" fill="#FFFFFF">Permission → Retrieval → LLM</tspan>
    <tspan fill="#8FA6D6">&#160;&#160;·&#160;&#160;</tspan>
    <tspan fill="#D7E2F7">Authorization is applied before retrieval, not after generation.</tspan>
  </text>

